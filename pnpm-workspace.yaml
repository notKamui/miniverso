allowBuilds:
  esbuild: true
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@latest
  vite-plus: ^1.0.0
  vitest: ^5.0.3
overrides:
  vite: 'catalog:'
  vitest: 'catalog:'
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: '*'
    vitest: '*'
minimumReleaseAge: 1440 # 1 day
minimumReleaseAgeExclude:
  - '@better-auth-ui/core@1.7.14'
  - '@better-auth-ui/react@1.7.14'
